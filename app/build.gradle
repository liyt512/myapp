plugins {
    id 'com.android.application'
}

def liubaiApiUrl = (project.findProperty('LIUBAI_API_URL') ?: System.getenv('LIUBAI_API_URL') ?: '').toString()

android {
    namespace 'app.liubai.social'
    compileSdk 36
    buildToolsVersion '36.0.0'

    defaultConfig {
        applicationId 'app.liubai.social'
        minSdk 23
        targetSdk 36
        versionCode 3
        versionName '1.2'
        buildConfigField 'String', 'LIUBAI_API_URL', '"' + liubaiApiUrl.replace('\\', '\\\\').replace('"', '\\"') + '"'
    }

    buildFeatures {
        buildConfig true
    }
}
